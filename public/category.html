<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Categoría - My Things</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563EB">
</head>

<body class="bg-gray-100 min-h-screen font-sans">

    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-10 flex items-center gap-3">
        <a href="index.html" class="text-white hover:bg-blue-700 p-2 rounded-full">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5"
                stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
            </svg>
        </a>
        <h1 class="text-xl font-bold">Nueva Categoría</h1>
    </header>

    <main class="max-w-md mx-auto p-4 mt-6">
        <div class="bg-white p-6 rounded-lg shadow-md">
            <label class="block mb-2 text-sm font-semibold text-gray-700">Nombre de la Categoría</label>
            <input type="text" id="catInput" placeholder="Ej: Ideas, Trabajo, Personal..."
                class="w-full border p-3 rounded mb-4 focus:outline-none focus:ring-2 focus:ring-blue-400">

            <button id="btnAddCat"
                class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg shadow hover:bg-blue-700 transition transform active:scale-95">
                Crear Categoría
            </button>
        </div>
    </main>

    <script type="module" src="./category.js"></script>
</body>

</html>
