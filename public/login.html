<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - My Things</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563EB">
</head>

<body class="bg-gray-100 h-screen flex flex-col justify-center items-center">

    <div class="bg-white p-8 rounded-lg shadow-lg max-w-sm w-full text-center">
        <h1 class="text-3xl font-bold text-blue-600 mb-2">My Things</h1>
        <p class="text-gray-500 mb-8">Guarda tus notas y enlaces de forma segura.</p>

        <button id="btnLogin"
            class="w-full bg-white border border-gray-300 text-gray-700 font-bold py-3 px-4 rounded shadow hover:bg-gray-50 flex items-center justify-center gap-3 transition">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="w-6 h-6">
            <span>Iniciar con Google</span>
        </button>

        <p id="errorMsg" class="text-red-500 text-sm mt-4 hidden"></p>
    </div>

    <script type="module" src="./login.js"></script>

</body>

</html>
