<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Registro PWA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#2563EB">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>

<body class="bg-gray-100 min-h-screen font-sans pb-20">

    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-xl font-bold">My Things</h1>
        <div class="flex gap-2">
            <button id="btnInstall"
                class="hidden bg-white text-blue-600 px-3 py-1 rounded text-sm font-bold shadow hover:bg-gray-100 transition">
                Instalar App
            </button>
            <button id="btnLogout"
                class="bg-blue-800 text-white px-3 py-1 rounded text-sm font-bold shadow hover:bg-blue-900 transition">
                Salir
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6 pb-24 relative min-h-screen">

        <!-- Filter and Add Category Link -->
        <div class="flex justify-between items-center bg-white p-3 rounded-lg shadow-sm">
            <select id="filterCat"
                class="border p-2 rounded text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-400 flex-1 mr-2">
                <option value="all">Todas las categorías</option>
            </select>
            <a href="category.html" class="text-blue-600 font-bold text-xl px-2 hover:bg-blue-50 rounded"
                title="Nueva Categoría">+</a>
        </div>

        <!-- Log List -->
        <div id="logList" class="space-y-3 pb-20">
            <p class="text-center text-gray-400 mt-10">Cargando registros...</p>
        </div>

        <!-- Floating Action Button (FAB) -->
        <a href="editor.html"
            class="fixed bottom-6 right-6 bg-blue-600 text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center hover:bg-blue-700 transition transform active:scale-90 z-50">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                stroke="currentColor" class="w-8 h-8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
            </svg>
        </a>

    </main>

    <script type="module" src="./home.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js?v=12')
                .then(() => console.log('Service Worker registrado'))
                .catch(err => console.error('Error SW:', err));
        }
    </script>
</body>

</html>
